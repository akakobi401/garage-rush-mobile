<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>GARAGE RUSH - MOBILE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&display=swap');
        * { -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: 'Syncopate', sans-serif; color: #fff;
            touch-action: none; -webkit-user-select: none;
        }
        
        .screen {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10000; 
            background: #000; text-align: center; padding: 20px;
        }
        
        .intro-logo {
            width: 80%; max-width: 300px; height: auto; margin-bottom: 30px;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.5));
            animation: logoFloat 3s infinite ease-in-out;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        h1 { color: #ffd700; font-size: clamp(1.5rem, 8vw, 2.5rem); margin: 10px 0; text-shadow: 0 0 25px rgba(255,215,0,0.6); }
        
        p { max-width: 90%; line-height: 1.6; color: #ccc; margin-bottom: 20px; font-size: clamp(0.7rem, 3vw, 0.85rem); }

        .gold-btn { 
            background: #ffd700; color: #000; border: none; padding: 15px 40px; 
            font-size: clamp(0.9rem, 4vw, 1.2rem); cursor: pointer; font-weight: 900; 
            text-transform: uppercase; letter-spacing: 3px;
            box-shadow: 0 0 30px rgba(255,215,0,0.4); transition: 0.3s;
        }
        .gold-btn:active { transform: scale(0.95); }
        .gold-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

        #hud { 
            position: fixed; top: 10px; left: 10px; display: none; z-index: 100;
            background: rgba(0,0,0,0.85); padding: 12px; border-left: 4px solid #ffd700;
            font-size: clamp(0.6rem, 2.5vw, 0.8rem);
        }
        .hud-item { margin-bottom: 6px; letter-spacing: 1px; }
        #boost-container { width: 100px; height: 8px; background: #222; border: 1px solid #444; margin-top: 8px; }
        #boost-bar { width: 100%; height: 100%; background: #00ff00; transition: width 0.1s linear; }

        #radar-container {
            position: fixed; bottom: 120px; right: 15px; width: 120px; height: 120px;
            background: rgba(0, 10, 0, 0.9); border: 2px solid #ffd700;
            border-radius: 50%; display: none; z-index: 100;
        }

        .joystick-container {
            position: fixed; bottom: 20px; left: 20px;
            width: 120px; height: 120px; display: none; z-index: 200;
        }
        .joystick-base {
            width: 100%; height: 100%;
            background: rgba(255,215,0,0.2); border: 3px solid rgba(255,215,0,0.5);
            border-radius: 50%;
        }
        .joystick-stick {
            position: absolute; top: 50%; left: 50%;
            width: 50px; height: 50px; margin: -25px 0 0 -25px;
            background: rgba(255,215,0,0.8); border: 2px solid #ffd700;
            border-radius: 50%; transition: all 0.1s;
        }

        .boost-btn {
            position: fixed; bottom: 20px; right: 20px;
            width: 90px; height: 90px; display: none; z-index: 200;
            background: rgba(0,255,0,0.3); border: 3px solid rgba(0,255,0,0.8);
            border-radius: 50%; font-size: 0.7rem; font-weight: 900;
            color: #0f0; text-align: center; line-height: 84px;
        }
        .boost-btn.disabled { opacity: 0.3; }
    </style>
</head>
<body>

<div id="gate" class="screen">
    <h1>GARAGE RUSH</h1>
    <p style="font-size: 0.7rem; color: #888;">MOBILE OPTIMIZED</p>
    <button class="gold-btn" id="enter-btn">ENTER ARENA</button>
</div>

<div id="briefing" class="screen" style="display:none;">
    <h1>MISSION BRIEFING</h1>
    <p>OBJECTIVE: RECOVER 12 WRENCHES.<br><br><span id="load-status" style="color:#ffd700;">CONNECTING...</span></p>
    <button class="gold-btn" id="start-btn" disabled>START MISSION</button>
</div>

<div id="game-over" class="screen" style="display:none;">
    <h1 id="result-title">FINISHED</h1>
    <button class="gold-btn" onclick="location.reload()">RETRY</button>
</div>

<div id="hud">
    <div class="hud-item">TOOLS: <span id="count" style="color:#ffd700">0</span>/12</div>
    <div class="hud-item" style="font-size: 1.2rem; font-weight: 900;">TIME: <span id="timer">1:30</span></div>
    <div id="boost-container"><div id="boost-bar"></div></div>
</div>

<div id="radar-container"><canvas id="radar-canvas" width="120" height="120"></canvas></div>

<div class="joystick-container">
    <div class="joystick-base"></div>
    <div class="joystick-stick" id="joystick-stick"></div>
</div>
<div class="boost-btn" id="boost-btn">BOOST</div>

<script type="module">
import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
import { GLTFLoader } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/loaders/GLTFLoader.js';
import { DRACOLoader } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/loaders/DRACOLoader.js';

class GarageGame {
    constructor() {
        this.active = false;
        this.items = [];
        this.timeLeft = 90;
        this.collected = 0;
        this.isBoosting = false;
        this.boostReady = true;
        this.boostValue = 100;
        this.joystickActive = false;
        this.joystickX = 0;
        this.joystickY = 0;
        
        this.initThree();
        this.setupMobileControls();
    }

    setupMobileControls() {
        const jb = document.querySelector('.joystick-container');
        const js = document.getElementById('joystick-stick');
        const bb = document.getElementById('boost-btn');
        let tId = null;

        jb.addEventListener('touchstart', (e) => {
            e.preventDefault();
            tId = e.touches[0].identifier;
            this.joystickActive = true;
            this.updateJoystick(e.touches[0], jb, js);
        });

        jb.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (let t of e.touches) if (t.identifier === tId) this.updateJoystick(t, jb, js);
        });

        jb.addEventListener('touchend', (e) => {
            e.preventDefault();
            tId = null;
            this.joystickActive = false;
            this.joystickX = 0; this.joystickY = 0;
            js.style.transform = 'translate(-50%, -50%)';
        });

        bb.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (this.boostReady && this.active) this.triggerBoost();
        });
    }

    updateJoystick(t, b, s) {
        const r = b.getBoundingClientRect();
        const cX = r.left + r.width/2, cY = r.top + r.height/2;
        let dX = t.clientX - cX, dY = t.clientY - cY;
        const dist = Math.sqrt(dX*dX + dY*dY);
        const max = 35;
        if (dist > max) { dX *= max/dist; dY *= max/dist; }
        this.joystickX = dX/max; this.joystickY = dY/max;
        s.style.transform = `translate(calc(-50% + ${dX}px), calc(-50% + ${dY}px))`;
    }

    initThree() {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x010103);
        this.camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        this.renderer = new THREE.WebGLRenderer({ antialias: false });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(this.renderer.domElement);

        this.scene.add(new THREE.HemisphereLight(0xffd700, 0x000033, 1.5));
        this.player = new THREE.Group();
        const pMesh = new THREE.Mesh(new THREE.ConeGeometry(0.4, 1.2, 4), new THREE.MeshStandardMaterial({ color: 0xffd700 }));
        pMesh.rotation.x = Math.PI/2;
        this.player.add(pMesh);
        this.player.position.set(212, 1, -236);
        this.scene.add(this.player);
        this.ctx = document.getElementById('radar-canvas').getContext('2d');
        this.animate();
    }

    triggerBoost() {
        this.isBoosting = true; this.boostReady = false;
        document.getElementById('boost-btn').classList.add('disabled');
        let bInt = setInterval(() => {
            this.boostValue -= 5;
            if(this.boostValue <= 0) {
                clearInterval(bInt); this.isBoosting = false;
                let rInt = setInterval(() => {
                    this.boostValue += 2;
                    if(this.boostValue >= 100) { clearInterval(rInt); this.boostReady = true; document.getElementById('boost-btn').classList.remove('disabled'); }
                }, 100);
            }
        }, 50);
    }

    spawnWrenches() {
        const mat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        for(let i=0; i<12; i++) {
            const g = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.1, 8, 8), mat);
            const a = Math.random() * 6.28;
            const d = 20 + Math.random() * 80;
            g.position.set(212 + Math.cos(a)*d, 1.5, -236 + Math.sin(a)*d);
            this.items.push(g); this.scene.add(g);
        }
    }

    animate() {
        requestAnimationFrame(() => this.animate());
        if(this.active) {
            let s = this.isBoosting ? 1.5 : 0.6;
            if(this.joystickActive) {
                this.player.translateZ(-this.joystickY * s);
                this.player.rotation.y += -this.joystickX * 0.05;
            }
            document.getElementById('boost-bar').style.width = this.boostValue + "%";
            this.items.forEach(w => {
                if(w.visible && this.player.position.distanceTo(w.position) < 5) {
                    w.visible = false; this.collected++;
                    document.getElementById('count').innerText = this.collected;
                    if(this.collected >= 12) this.endGame(true);
                }
            });
            this.ctx.clearRect(0,0,120,120);
            this.items.forEach(w => { if(w.visible) {
                this.ctx.fillStyle = "#fff"; this.ctx.beginPath();
                this.ctx.arc(60+(w.position.x-this.player.position.x)*0.5, 60+(w.position.z-this.player.position.z)*0.5, 2, 0, 7);
                this.ctx.fill();
            }});
        }
        const cO = new THREE.Vector3(0, 5, 12).applyQuaternion(this.player.quaternion);
        this.camera.position.lerp(this.player.position.clone().add(cO), 0.1);
        this.camera.lookAt(this.player.position);
        this.renderer.render(this.scene, this.camera);
    }

    endGame(win) {
        this.active = false;
        document.getElementById('hud').style.display = 'none';
        document.getElementById('game-over').style.display = 'flex';
        document.getElementById('result-title').innerText = win ? "CLEARED" : "FAILED";
    }
}

const game = new GarageGame();

document.getElementById('enter-btn').onclick = () => {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('briefing').style.display = 'flex';
    
    const draco = new DRACOLoader();
    draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
    const loader = new GLTFLoader();
    loader.setDRACOLoader(draco);
    
    const url = 'https://dl.dropboxusercontent.com/scl/fi/zyvmatbq3vghfqivnoikt/arena-mobile.glb?rlkey=szzux9sj9td425xngkzu3vni1&raw=1';

    loader.load(url, 
        (gltf) => {
            game.scene.add(gltf.scene);
            game.spawnWrenches();
            document.getElementById('load-status').innerText = "ARENA READY";
            document.getElementById('start-btn').disabled = false;
        },
        (p) => {
            const pct = Math.round((p.loaded / p.total) * 100);
            document.getElementById('load-status').innerText = `LOADING: ${pct}%`;
        },
        (e) => {
            console.error(e);
            document.getElementById('load-status').innerText = "ERROR LOADING FILE";
        }
    );
    
    const audio = new Audio('https://dl.dropboxusercontent.com/scl/fi/lg4b8xgncie3x1b1ez4h8/Igzotic-Money-chaser-Official-Music-Video.mp3?rlkey=umjddw56vwumbnd2qjkg0ft2e&raw=1');
    audio.loop = true; audio.play().catch(()=>{});
};

document.getElementById('start-btn').onclick = () => {
    document.getElementById('briefing').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    document.getElementById('radar-container').style.display = 'block';
    document.querySelector('.joystick-container').style.display = 'block';
    document.getElementById('boost-btn').style.display = 'block';
    game.active = true;
    setInterval(() => { if(game.active) { game.timeLeft--; document.getElementById('timer').innerText = `0:${game.timeLeft.toString().padStart(2,'0')}`; if(game.timeLeft<=0) game.endGame(false); }}, 1000);
};
</script>
</body>
</html>
