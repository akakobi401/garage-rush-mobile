<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>GARAGE RUSH - MOBILE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&display=swap');
        * { -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: 'Syncopate', sans-serif; color: #fff;
            touch-action: none; -webkit-user-select: none;
        }
        
        .screen {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10000; 
            background: #000; text-align: center; padding: 20px;
        }
        
        .intro-logo {
            width: 80%; max-width: 300px; height: auto; margin-bottom: 30px;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.5));
            animation: logoFloat 3s infinite ease-in-out;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        h1 { color: #ffd700; font-size: clamp(1.5rem, 8vw, 2.5rem); margin: 10px 0; text-shadow: 0 0 25px rgba(255,215,0,0.6); }
        
        #new-record-tag {
            color: #00ff00; font-size: clamp(1rem, 5vw, 1.5rem); margin-bottom: 10px;
            display: none; animation: flash 0.5s infinite;
        }
        @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        p { max-width: 90%; line-height: 1.6; color: #ccc; margin-bottom: 20px; font-size: clamp(0.7rem, 3vw, 0.85rem); }

        .gold-btn { 
            background: #ffd700; color: #000; border: none; padding: 15px 40px; 
            font-size: clamp(0.9rem, 4vw, 1.2rem); cursor: pointer; font-weight: 900; 
            text-transform: uppercase; letter-spacing: 3px;
            box-shadow: 0 0 30px rgba(255,215,0,0.4); transition: 0.3s;
        }
        .gold-btn:active { transform: scale(0.95); }
        .gold-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

        #hud { 
            position: fixed; top: 10px; left: 10px; display: none; z-index: 100;
            background: rgba(0,0,0,0.85); padding: 12px; border-left: 4px solid #ffd700;
            font-size: clamp(0.6rem, 2.5vw, 0.8rem);
        }
        .hud-item { margin-bottom: 6px; letter-spacing: 1px; }
        #boost-container { width: 100px; height: 8px; background: #222; border: 1px solid #444; margin-top: 8px; }
        #boost-bar { width: 100%; height: 100%; background: #00ff00; transition: width 0.1s linear; }

        #radar-container {
            position: fixed; bottom: 120px; right: 15px; width: 120px; height: 120px;
            background: rgba(0, 10, 0, 0.9); border: 2px solid #ffd700;
            border-radius: 50%; display: none; z-index: 100;
        }

        .joystick-container {
            position: fixed; bottom: 20px; left: 20px;
            width: 120px; height: 120px; display: none; z-index: 200;
        }
        .joystick-base {
            width: 100%; height: 100%;
            background: rgba(255,215,0,0.2); border: 3px solid rgba(255,215,0,0.5);
            border-radius: 50%;
        }
        .joystick-stick {
            position: absolute; top: 50%; left: 50%;
            width: 50px; height: 50px; margin: -25px 0 0 -25px;
            background: rgba(255,215,0,0.8); border: 2px solid #ffd700;
            border-radius: 50%; transition: all 0.1s;
            box-shadow: 0 0 15px rgba(255,215,0,0.6);
        }

        .boost-btn {
            position: fixed; bottom: 20px; right: 20px;
            width: 90px; height: 90px; display: none; z-index: 200;
            background: rgba(0,255,0,0.3); border: 3px solid rgba(0,255,0,0.8);
            border-radius: 50%; font-size: 0.7rem; font-weight: 900;
            color: #0f0; text-align: center; line-height: 84px;
            box-shadow: 0 0 20px rgba(0,255,0,0.4);
        }
        .boost-btn:active { background: rgba(0,255,0,0.6); }
        .boost-btn.disabled { opacity: 0.3; border-color: #666; color: #666; }
    </style>
</head>
<body>

<div id="gate" class="screen">
    <img src="logo.png" alt="AKA KOBI" class="intro-logo" onerror="this.style.display='none'">
    <h1>GARAGE RUSH</h1>
    <p style="font-size: 0.7rem; color: #888;">MOBILE VERSION</p>
    <button class="gold-btn" id="enter-btn">ENTER ARENA</button>
</div>

<div id="briefing" class="screen" style="display:none;">
    <h1>MISSION BRIEFING</h1>
    <p>OBJECTIVE: RECOVER 12 EXPERIMENTAL WRENCHES.<br>TIME LIMIT: 90 SECONDS<br><br><span id="load-status" style="color:#ffd700;">BUILDING ENVIRONMENT...</span></p>
    <div id="best-time-display" style="color: #ffd700; margin: 15px 0; font-size: clamp(0.7rem, 3vw, 0.9rem);"></div>
    <button class="gold-btn" id="start-btn" disabled>START MISSION</button>
</div>

<div id="game-over" class="screen" style="display:none;">
    <div id="new-record-tag">★ NEW BEST ★</div>
    <h1 id="result-title">MISSION COMPLETE</h1>
    <div id="stats" style="margin: 20px 0; font-size: clamp(0.9rem, 4vw, 1.2rem);"></div>
    <button class="gold-btn" onclick="location.reload()">RETRY</button>
</div>

<div id="hud">
    <div class="hud-item">TOOLS: <span id="count" style="color:#ffd700">0</span>/12</div>
    <div class="hud-item" style="font-size: clamp(1rem, 4vw, 1.6rem); margin: 8px 0; font-weight: 900;">TIME: <span id="timer">1:30</span></div>
    <div class="hud-item">SCORE: <span id="score" style="color:#ffd700">0</span></div>
    <div id="boost-container"><div id="boost-bar"></div></div>
    <div id="boost-text" style="font-size: 0.5rem; margin-top: 4px; color: #0f0;">BOOST READY</div>
</div>

<div id="radar-container"><canvas id="radar-canvas" width="120" height="120"></canvas></div>

<div class="joystick-container">
    <div class="joystick-base"></div>
    <div class="joystick-stick" id="joystick-stick"></div>
</div>
<div class="boost-btn" id="boost-btn">BOOST</div>

<script type="module">
import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';

class GarageGame {
    constructor() {
        this.active = false;
        this.items = [];
        this.score = 0;
        this.startTime = 90;
        this.timeLeft = 90;
        this.collected = 0;
        this.isBoosting = false;
        this.boostReady = true;
        this.boostValue = 100;
        
        this.joystickActive = false;
        this.joystickX = 0;
        this.joystickY = 0;
        
        this.pingSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3');
        this.pingSound.volume = 0.15;

        this.initThree();
        this.setupMobileControls();
        this.updateBestTimeDisplay();
    }

    setupMobileControls() {
        const joystickBase = document.querySelector('.joystick-container');
        const joystickStick = document.getElementById('joystick-stick');
        const boostBtn = document.getElementById('boost-btn');
        
        let touchId = null;
        
        joystickBase.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (touchId === null && this.active) {
                touchId = e.touches[0].identifier;
                this.joystickActive = true;
                this.updateJoystick(e.touches[0], joystickBase, joystickStick);
            }
        });
        
        joystickBase.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (this.active) {
                for (let touch of e.touches) {
                    if (touch.identifier === touchId) {
                        this.updateJoystick(touch, joystickBase, joystickStick);
                    }
                }
            }
        });
        
        joystickBase.addEventListener('touchend', (e) => {
            e.preventDefault();
            touchId = null;
            this.joystickActive = false;
            this.joystickX = 0;
            this.joystickY = 0;
            joystickStick.style.transform = 'translate(-50%, -50%)';
        });
        
        boostBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (this.boostReady && this.active) {
                this.triggerBoost();
            }
        });
    }
    
    updateJoystick(touch, base, stick) {
        const rect = base.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        
        let deltaX = touch.clientX - centerX;
        let deltaY = touch.clientY - centerY;
        
        const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
        const maxDistance = 35;
        
        if (distance > maxDistance) {
            deltaX = (deltaX / distance) * maxDistance;
            deltaY = (deltaY / distance) * maxDistance;
        }
        
        this.joystickX = deltaX / maxDistance;
        this.joystickY = deltaY / maxDistance;
        
        stick.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;
    }

    updateBestTimeDisplay() {
        const best = localStorage.getItem('kobi_best_time');
        const display = document.getElementById('best-time-display');
        if (best) display.innerText = `PERSONAL BEST: ${best}s`;
    }

    initThree() {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x010103);
        this.scene.fog = new THREE.FogExp2(0x010103, 0.008);
        this.camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 800);
        this.renderer = new THREE.WebGLRenderer({ 
            antialias: false, 
            powerPreference: "low-power"
        });
        this.renderer.setPixelRatio(1);
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(this.renderer.domElement);

        this.scene.add(new THREE.HemisphereLight(0xffd700, 0x000033, 0.8));
        this.scene.add(new THREE.AmbientLight(0x404040, 0.3));

        this.player = new THREE.Group();
        const pMesh = new THREE.Mesh(
            new THREE.ConeGeometry(0.4, 1.3, 4), 
            new THREE.MeshBasicMaterial({ color: 0xffd700 })
        );
        pMesh.rotation.x = Math.PI/2;
        this.player.add(pMesh);
        this.player.add(new THREE.PointLight(0xffd700, 10, 20));

        this.player.position.set(0, 0.8, 0);
        this.scene.add(this.player);

        this.ctx = document.getElementById('radar-canvas').getContext('2d');
        
        window.addEventListener('resize', () => {
            this.camera.aspect = window.innerWidth / window.innerHeight;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        this.animate();
    }

    triggerBoost() {
        this.isBoosting = true; 
        this.boostReady = false;
        document.getElementById('boost-text').innerText = "BOOSTING...";
        document.getElementById('boost-btn').classList.add('disabled');
        
        let blast = setInterval(() => {
            this.boostValue -= 4;
            if(this.boostValue <= 0) { 
                clearInterval(blast); 
                this.isBoosting = false; 
                this.startCooldown(); 
            }
        }, 80);
    }

    startCooldown() {
        document.getElementById('boost-text').innerText = "RECHARGING...";
        let recharge = setInterval(() => {
            this.boostValue += 2;
            if(this.boostValue >= 100) { 
                clearInterval(recharge); 
                this.boostReady = true; 
                document.getElementById('boost-text').innerText = "BOOST READY";
                document.getElementById('boost-btn').classList.remove('disabled');
            }
        }, 100);
    }

    createLightweightEnvironment() {
        // Lightweight ground
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(400, 400, 1, 1),
            new THREE.MeshBasicMaterial({ color: 0x1a1a1a })
        );
        ground.rotation.x = -Math.PI/2;
        this.scene.add(ground);
        
        // Simple walls
        const wallMat = new THREE.MeshBasicMaterial({ color: 0x2a2a2a });
        const wall1 = new THREE.Mesh(new THREE.BoxGeometry(400, 25, 2), wallMat);
        wall1.position.set(0, 12.5, -200);
        const wall2 = new THREE.Mesh(new THREE.BoxGeometry(400, 25, 2), wallMat);
        wall2.position.set(0, 12.5, 200);
        const wall3 = new THREE.Mesh(new THREE.BoxGeometry(2, 25, 400), wallMat);
        wall3.position.set(-200, 12.5, 0);
        const wall4 = new THREE.Mesh(new THREE.BoxGeometry(2, 25, 400), wallMat);
        wall4.position.set(200, 12.5, 0);
        this.scene.add(wall1, wall2, wall3, wall4);
        
        // Add some pillars for visual interest
        const pillarMat = new THREE.MeshBasicMaterial({ color: 0x444444 });
        for(let i = 0; i < 8; i++) {
            const angle = (i / 8) * Math.PI * 2;
            const pillar = new THREE.Mesh(new THREE.BoxGeometry(4, 20, 4), pillarMat);
            pillar.position.set(Math.cos(angle) * 120, 10, Math.sin(angle) * 120);
            this.scene.add(pillar);
        }
    }

    spawnWrenches() {
        const metal = new THREE.MeshBasicMaterial({ color: 0xffffff });
        for(let i=0; i<12; i++) {
            const group = new THREE.Group();
            const head = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.08, 6, 10, Math.PI * 1.6), metal);
            const handle = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.75, 0.1), metal);
            handle.position.y = -0.45;
            group.add(head, handle);
            const ring = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.02, 12, 30), new THREE.MeshBasicMaterial({ color: 0xff6600 }));
            ring.rotation.x = Math.PI/2;
            group.add(ring);
            
            const angle = Math.random() * 6.28;
            const dist = 30 + Math.random() * 150;
            group.position.set(Math.cos(angle)*dist, 1.6, Math.sin(angle)*dist);
            
            this.items.push(group);
            this.scene.add(group);
        }
    }

    animate() {
        requestAnimationFrame(() => this.animate());
        
        if(this.active) {
            let speed = this.isBoosting ? 1.5 : 0.55;
            
            if (this.joystickActive) {
                const moveAmount = -this.joystickY * speed;
                this.player.translateZ(moveAmount);
                
                const turnAmount = -this.joystickX * 0.06;
                this.player.rotation.y += turnAmount;
            }

            document.getElementById('boost-bar').style.width = this.boostValue + "%";
            
            this.items.forEach(w => {
                if(w.visible && this.player.position.distanceTo(w.position) < 6) {
                    w.visible = false;
                    const s = this.pingSound.cloneNode(); 
                    s.volume = 0.15; 
                    s.play().catch(()=>{});
                    this.collected++;
                    this.score += 200;
                    document.getElementById('count').innerText = this.collected;
                    document.getElementById('score').innerText = this.score;
                    if(this.collected >= 12) this.endGame(true);
                }
            });

            const ctx = this.ctx; 
            ctx.clearRect(0,0,120,120);
            this.items.forEach(item => {
                if(item.visible) {
                    ctx.fillStyle = "#fff"; 
                    ctx.beginPath();
                    ctx.arc(60 + (item.position.x - this.player.position.x)*0.3, 60 + (item.position.z - this.player.position.z)*0.3, 2, 0, 7);
                    ctx.fill();
                }
            });
            ctx.fillStyle = "#ffd700"; 
            ctx.beginPath(); 
            ctx.arc(60,60,4,0,7); 
            ctx.fill();
        }
        
        const camOff = new THREE.Vector3(0, 4, 10).applyQuaternion(this.player.quaternion);
        this.camera.position.lerp(this.player.position.clone().add(camOff), 0.12);
        this.camera.lookAt(this.player.position);
        this.renderer.render(this.scene, this.camera);
    }

    endGame(win) {
        this.active = false;
        const timeTaken = this.startTime - this.timeLeft;
        let isNewRecord = false;
        if (win) {
            const best = localStorage.getItem('kobi_best_time');
            if (!best || timeTaken < parseInt(best)) {
                localStorage.setItem('kobi_best_time', timeTaken);
                isNewRecord = true;
            }
        }
        document.getElementById('hud').style.display = 'none';
        document.getElementById('radar-container').style.display = 'none';
        document.querySelector('.joystick-container').style.display = 'none';
        document.getElementById('boost-btn').style.display = 'none';
        document.getElementById('game-over').style.display = 'flex';
        document.getElementById('new-record-tag').style.display = isNewRecord ? 'block' : 'none';
        document.getElementById('result-title').innerText = win ? "MISSION COMPLETE" : "MISSION FAILED";
        document.getElementById('stats').innerHTML = `SCORE: ${this.score}<br>TIME: ${timeTaken}s`;
    }
}

const game = new GarageGame();

document.getElementById('enter-btn').onclick = () => {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('briefing').style.display = 'flex';
    
    // Skip loading heavy arena file - use lightweight environment instead
    setTimeout(() => {
        document.getElementById('load-status').innerText = "BUILDING ENVIRONMENT...";
        game.createLightweightEnvironment();
        game.spawnWrenches();
        document.getElementById('load-status').innerText = "READY FOR DEPLOYMENT";
        document.getElementById('start-btn').disabled = false;
    }, 500);
    
    const audio = new Audio('https://dl.dropboxusercontent.com/scl/fi/lg4b8xgncie3x1b1ez4h8/Igzotic-Money-chaser-Official-Music-Video.mp3?rlkey=umjddw56vwumbnd2qjkg0ft2e&raw=1');
    audio.loop = true; 
    audio.volume = 0.3;
    audio.play().catch(()=>{});
};

document.getElementById('start-btn').onclick = () => {
    document.getElementById('briefing').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    document.getElementById('radar-container').style.display = 'block';
    document.querySelector('.joystick-container').style.display = 'block';
    document.getElementById('boost-btn').style.display = 'flex';
    game.active = true;
    
    const timerInt = setInterval(() => { 
        if(!game.active) { clearInterval(timerInt); return; }
        game.timeLeft--; 
        let m = Math.floor(game.timeLeft/60), s = game.timeLeft%60;
        document.getElementById('timer').innerText = `${m}:${s.toString().padStart(2,'0')}`;
        if(game.timeLeft <= 0) game.endGame(false);
    }, 1000);
};
</script>
</body>
</html>
