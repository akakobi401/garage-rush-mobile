<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>GARAGE RUSH - MOBILE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&display=swap');
        * { -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: 'Syncopate', sans-serif; color: #fff;
            touch-action: none; -webkit-user-select: none;
        }
        
        /* SCREEN LAYOUT */
        .screen {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10000; 
            background: #000; text-align: center; padding: 20px;
        }
        
        /* --- LOGO ANIMATION (Back from Desktop version) --- */
        .intro-logo {
            width: 70%; 
            max-width: 280px; 
            height: auto; 
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.4));
            animation: logoFloat 3s infinite ease-in-out;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        /* -------------------------------------------------- */

        h1 { color: #ffd700; font-size: clamp(1.5rem, 8vw, 2.5rem); margin: 10px 0; text-shadow: 0 0 25px rgba(255,215,0,0.6); }
        p { max-width: 90%; line-height: 1.6; color: #ccc; margin-bottom: 20px; font-size: clamp(0.7rem, 3vw, 0.85rem); }

        .gold-btn { 
            background: #ffd700; color: #000; border: none; padding: 15px 40px; 
            font-size: clamp(0.9rem, 4vw, 1.2rem); cursor: pointer; font-weight: 900; 
            text-transform: uppercase; letter-spacing: 3px;
            box-shadow: 0 0 30px rgba(255,215,0,0.4); transition: 0.3s;
        }
        .gold-btn:active { transform: scale(0.95); }

        /* HUD & RADAR */
        #hud { position: fixed; top: 10px; left: 10px; display: none; z-index: 100; background: rgba(0,0,0,0.8); padding: 10px; border-left: 3px solid #ffd700; }
        #radar-container { position: fixed; bottom: 120px; right: 15px; width: 100px; height: 100px; background: rgba(0, 10, 0, 0.9); border: 2px solid #ffd700; border-radius: 50%; display: none; z-index: 100; }

        /* MOBILE CONTROLS */
        .joystick-container { position: fixed; bottom: 30px; left: 30px; width: 100px; height: 100px; display: none; z-index: 200; }
        .joystick-base { width: 100%; height: 100%; background: rgba(255,215,0,0.1); border: 2px solid rgba(255,215,0,0.3); border-radius: 50%; }
        .joystick-stick { position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; background: rgba(255,215,0,0.7); border-radius: 50%; }
        .boost-btn { position: fixed; bottom: 30px; right: 30px; width: 80px; height: 80px; display: none; z-index: 200; background: rgba(0,255,0,0.2); border: 2px solid #0f0; border-radius: 50%; color: #0f0; font-weight: 900; font-size: 0.7rem; text-align: center; line-height: 76px; }
    </style>
</head>
<body>

<div id="gate" class="screen">
    <img src="logo.png" alt="AKA KOBI" class="intro-logo" onerror="this.style.display='none'">
    <h1>GARAGE RUSH</h1>
    <p style="font-size: 0.7rem; color: #888;">MOBILE VERSION</p>
    <button class="gold-btn" id="enter-btn">ENTER ARENA</button>
</div>

<div id="briefing" class="screen" style="display:none;">
    <h1>MISSION BRIEFING</h1>
    <p>OBJECTIVE: RECOVER 12 WRENCHES.<br>TIME LIMIT: 90s<br><br><span id="load-status" style="color:#ffd700;">LOADING ARENA...</span></p>
    <button class="gold-btn" id="start-btn" disabled>START MISSION</button>
</div>

<div id="hud">
    <div style="font-size: 0.7rem;">TOOLS: <span id="count" style="color:#ffd700">0</span>/12</div>
    <div id="timer" style="font-size: 1.2rem; font-weight: 900;">1:30</div>
</div>

<div id="radar-container"><canvas id="radar-canvas" width="100" height="100"></canvas></div>

<div class="joystick-container">
    <div class="joystick-base"></div>
    <div class="joystick-stick" id="joystick-stick"></div>
</div>
<div class="boost-btn" id="boost-btn">BOOST</div>

<script type="module">
import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
import { GLTFLoader } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/loaders/GLTFLoader.js';
import { DRACOLoader } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/loaders/DRACOLoader.js';

class GarageGame {
    constructor() {
        this.active = false;
        this.items = [];
        this.timeLeft = 90;
        this.collected = 0;
        this.joystickActive = false;
        this.joystickX = 0;
        this.joystickY = 0;
        
        this.initThree();
        this.setupMobileControls();
    }

    setupMobileControls() {
        const jc = document.querySelector('.joystick-container');
        const js = document.getElementById('joystick-stick');
        let tId = null;

        jc.addEventListener('touchstart', (e) => {
            e.preventDefault();
            tId = e.touches[0].identifier;
            this.joystickActive = true;
        });

        jc.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = Array.from(e.touches).find(t => t.identifier === tId);
            if (!touch) return;

            const rect = jc.getBoundingClientRect();
            const centerX = rect.left + rect.width/2;
            const centerY = rect.top + rect.height/2;
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 35);
            const angle = Math.atan2(dy, dx);
            
            dx = Math.cos(angle) * dist;
            dy = Math.sin(angle) * dist;

            this.joystickX = dx / 35;
            this.joystickY = dy / 35;
            js.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        });

        jc.addEventListener('touchend', () => {
            this.joystickActive = false;
            this.joystickX = 0; this.joystickY = 0;
            js.style.transform = 'translate(-50%, -50%)';
        });

        document.getElementById('boost-btn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            this.isBoosting = true;
            setTimeout(() => this.isBoosting = false, 2000);
        });
    }

    initThree() {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x010103);
        this.camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        this.renderer = new THREE.WebGLRenderer({ antialias: false });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(this.renderer.domElement);

        this.scene.add(new THREE.HemisphereLight(0xffd700, 0x000033, 1.5));
        this.player = new THREE.Group();
        const pMesh = new THREE.Mesh(new THREE.ConeGeometry(0.4, 1.2, 4), new THREE.MeshStandardMaterial({ color: 0xffd700 }));
        pMesh.rotation.x = Math.PI/2;
        this.player.add(pMesh);
        this.player.position.set(212, 1, -236);
        this.scene.add(this.player);
        this.ctx = document.getElementById('radar-canvas').getContext('2d');
        this.animate();
    }

    spawnWrenches() {
        const mat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        for(let i=0; i<12; i++) {
            const g = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.1, 8, 8), mat);
            const a = Math.random() * 6.28;
            const d = 20 + Math.random() * 80;
            g.position.set(212 + Math.cos(a)*d, 1.5, -236 + Math.sin(a)*d);
            this.items.push(g); this.scene.add(g);
        }
    }

    animate() {
        requestAnimationFrame(() => this.animate());
        if(this.active) {
            let s = this.isBoosting ? 1.5 : 0.6;
            if(this.joystickActive) {
                this.player.translateZ(-this.joystickY * s);
                this.player.rotation.y += -this.joystickX * 0.05;
            }
            this.items.forEach(w => {
                if(w.visible && this.player.position.distanceTo(w.position) < 5) {
                    w.visible = false; this.collected++;
                    document.getElementById('count').innerText = this.collected;
                }
            });
            this.ctx.clearRect(0,0,100,100);
            this.items.forEach(w => { if(w.visible) {
                this.ctx.fillStyle = "#fff"; this.ctx.beginPath();
                this.ctx.arc(50+(w.position.x-this.player.position.x)*0.5, 50+(w.position.z-this.player.position.z)*0.5, 2, 0, 7);
                this.ctx.fill();
            }});
        }
        const cO = new THREE.Vector3(0, 5, 12).applyQuaternion(this.player.quaternion);
        this.camera.position.lerp(this.player.position.clone().add(cO), 0.1);
        this.camera.lookAt(this.player.position);
        this.renderer.render(this.scene, this.camera);
    }
}

const game = new GarageGame();

document.getElementById('enter-btn').onclick = () => {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('briefing').style.display = 'flex';
    
    const draco = new DRACOLoader();
    draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
    const loader = new GLTFLoader();
    loader.setDRACOLoader(draco);
    
    // Fixed Arena Link
    const url = 'https://dl.dropboxusercontent.com/scl/fi/zyvmatbq3vghfqivnoikt/arena-mobile.glb?rlkey=szzux9sj9td425xngkzu3vni1&raw=1';

    loader.load(url, (gltf) => {
        game.scene.add(gltf.scene);
        game.spawnWrenches();
        document.getElementById('load-status').innerText = "READY";
        document.getElementById('start-btn').disabled = false;
    });
};

document.getElementById('start-btn').onclick = () => {
    document.getElementById('briefing').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    document.getElementById('radar-container').style.display = 'block';
    document.querySelector('.joystick-container').style.display = 'block';
    document.getElementById('boost-btn').style.display = 'block';
    game.active = true;
};
</script>
</body>
</html>
