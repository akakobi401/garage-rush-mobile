<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GARAGE RUSH - MOBILE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&display=swap');
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Syncopate', sans-serif; color: #fff; touch-action: none; -webkit-user-select: none; }
        .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; background: #000; text-align: center; padding: 20px; }
        .intro-logo { width: 70%; max-width: 280px; height: auto; margin-bottom: 20px; animation: logoFloat 3s infinite ease-in-out; }
        @keyframes logoFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        .gold-btn { background: #ffd700; color: #000; border: none; padding: 15px 40px; font-size: 1rem; cursor: pointer; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }
        #hud { position: fixed; top: 20px; left: 20px; display: none; z-index: 500; background: rgba(0,0,0,0.7); padding: 15px; border-left: 4px solid #ffd700; }
        #radar-container { position: fixed; bottom: 120px; right: 20px; width: 110px; height: 110px; background: rgba(0, 20, 0, 0.8); border: 2px solid #ffd700; border-radius: 50%; display: none; z-index: 500; }
        .joystick-container { position: fixed; bottom: 30px; left: 30px; width: 120px; height: 120px; display: none; z-index: 1000; }
        .joystick-base { width: 100%; height: 100%; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; }
        .joystick-stick { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; background: #ffd700; border-radius: 50%; }
        .boost-btn { position: fixed; bottom: 30px; right: 30px; width: 85px; height: 85px; display: none; z-index: 1000; background: rgba(0,255,0,0.2); border: 2px solid #0f0; border-radius: 50%; color: #0f0; font-weight: 900; text-align: center; line-height: 81px; font-size: 10px; }
    </style>
</head>
<body>

<div id="gate" class="screen">
    <img src="logo.png" alt="AKA KOBI" class="intro-logo" onerror="this.style.display='none'">
    <h1>GARAGE RUSH</h1>
    <button class="gold-btn" id="enter-btn">ENTER ARENA</button>
</div>

<div id="briefing" class="screen" style="display:none;">
    <h1>MISSION BRIEFING</h1>
    <p id="load-status" style="color:#ffd700;">REALIGNING VECTORS...</p>
    <button class="gold-btn" id="start-btn" disabled>START MISSION</button>
</div>

<div id="hud">
    <div style="font-size:0.8rem;">TOOLS: <span id="count" style="color:#ffd700">0</span>/12</div>
    <div style="font-size: 1.2rem;">TIME: <span id="timer">1:30</span></div>
</div>

<div id="radar-container"><canvas id="radar-canvas" width="110" height="110"></canvas></div>
<div class="joystick-container"><div class="joystick-base"></div><div class="joystick-stick" id="joystick-stick"></div></div>
<div class="boost-btn" id="boost-btn">BOOST</div>

<script type="module">
import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
import { GLTFLoader } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/loaders/GLTFLoader.js';
import { DRACOLoader } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/loaders/DRACOLoader.js';

class GarageGame {
    constructor() {
        this.active = false;
        this.items = [];
        this.timeLeft = 90;
        this.collected = 0;
        this.joystickActive = false;
        this.joystickX = 0;
        this.joystickY = 0;
        this.isBoosting = false;
        
        this.initThree();
        this.setupMobileControls();
    }

    setupMobileControls() {
        const jc = document.querySelector('.joystick-container');
        const js = document.getElementById('joystick-stick');
        jc.addEventListener('touchstart', (e) => { e.preventDefault(); this.joystickActive = true; });
        jc.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = jc.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 40);
            const angle = Math.atan2(dy, dx);
            this.joystickX = (Math.cos(angle) * dist) / 40;
            this.joystickY = (Math.sin(angle) * dist) / 40; // Forward is negative
            js.style.transform = `translate(calc(-50% + ${Math.cos(angle) * dist}px), calc(-50% + ${Math.sin(angle) * dist}px))`;
        });
        jc.addEventListener('touchend', () => { this.joystickActive = false; this.joystickX = 0; this.joystickY = 0; js.style.transform = 'translate(-50%, -50%)'; });
        document.getElementById('boost-btn').addEventListener('touchstart', (e) => { e.preventDefault(); this.isBoosting = true; });
        document.getElementById('boost-btn').addEventListener('touchend', () => { this.isBoosting = false; });
    }

    initThree() {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x020205);
        this.camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        this.renderer = new THREE.WebGLRenderer({ antialias: true });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(this.renderer.domElement);

        this.scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2.0));
        
        this.player = new THREE.Group();
        // The cone itself
        const pMesh = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.2, 4), new THREE.MeshStandardMaterial({ color: 0xffd700 }));
        pMesh.rotation.x = -Math.PI/2; // Orient cone to look forward
        this.player.add(pMesh);
        this.player.position.set(212, 1, -236);
        this.scene.add(this.player);

        this.ctx = document.getElementById('radar-canvas').getContext('2d');
        this.animate();
    }

    animate() {
        requestAnimationFrame(() => this.animate());
        if(this.active) {
            let s = this.isBoosting ? 1.6 : 0.8;
            if(this.joystickActive) {
                // FORCE FORWARD: Using local Z axis properly
                this.player.translateZ(-this.joystickY * s); 
                this.player.rotation.y -= this.joystickX * 0.05;
            }
        }

        // CAMERA PLACEMENT: Fixed to stay behind the cone's "tail"
        const cameraOffset = new THREE.Vector3(0, 6, 12).applyQuaternion(this.player.quaternion);
        this.camera.position.copy(this.player.position).add(cameraOffset);
        this.camera.lookAt(this.player.position);
        
        this.renderer.render(this.scene, this.camera);
    }
}

const game = new GarageGame();

document.getElementById('enter-btn').onclick = () => {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('briefing').style.display = 'flex';
    const loader = new GLTFLoader();
    const draco = new DRACOLoader();
    draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
    loader.setDRACOLoader(draco);
    loader.load('https://dl.dropboxusercontent.com/scl/fi/zyvmatbq3vghfqivnoikt/arena-mobile.glb?rlkey=szzux9sj9td425xngkzu3vni1&raw=1', (gltf) => {
        game.scene.add(gltf.scene);
        document.getElementById('load-status').innerText = "VECTORS ALIGNED";
        document.getElementById('start-btn').disabled = false;
    });
};

document.getElementById('start-btn').onclick = () => {
    document.getElementById('briefing').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    document.getElementById('radar-container').style.display = 'block';
    document.querySelector('.joystick-container').style.display = 'block';
    document.getElementById('boost-btn').style.display = 'block';
    game.active = true;
};
</script>
</body>
</html>
