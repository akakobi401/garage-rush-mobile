<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GARAGE RUSH - MOBILE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&display=swap');
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Syncopate', sans-serif; color: #fff; touch-action: none; }
        
        /* SCREENS */
        .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; background: #000; text-align: center; }
        .intro-logo { width: 250px; margin-bottom: 20px; animation: logoFloat 3s infinite ease-in-out; }
        @keyframes logoFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        
        .gold-btn { background: #ffd700; color: #000; border: none; padding: 15px 40px; font-weight: 900; text-transform: uppercase; cursor: pointer; letter-spacing: 2px; }
        
        /* HUD & OVERHEAT */
        #hud { position: fixed; top: 20px; left: 20px; display: none; z-index: 1500; background: rgba(0,0,0,0.8); padding: 15px; border-left: 4px solid #ffd700; pointer-events: none; }
        .heat-container { width: 120px; height: 12px; background: rgba(255,255,255,0.1); margin-top: 8px; border: 1px solid rgba(255,255,255,0.3); position: relative; overflow: hidden; }
        #heat-bar { width: 0%; height: 100%; background: #0f0; transition: width 0.1s; }

        /* JOYSTICK */
        .joystick-container { position: fixed; bottom: 40px; left: 40px; width: 130px; height: 130px; display: none; z-index: 1500; }
        .joystick-base { width: 100%; height: 100%; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; }
        .joystick-stick { position: absolute; top: 50%; left: 50%; width: 55px; height: 55px; margin: -27.5px 0 0 -27.5px; background: #ffd700; border-radius: 50%; box-shadow: 0 0 15px rgba(255,215,0,0.5); }
        
        /* BOOST BUTTON - FIXED VISIBILITY */
        #boost-btn { 
            position: fixed; 
            bottom: 45px; 
            right: 45px; 
            width: 100px; 
            height: 100px; 
            display: none; 
            z-index: 1600; /* Higher than joystick */
            background: rgba(255,0,0,0.2); 
            border: 4px solid #f00; 
            border-radius: 50%; 
            color: #fff; 
            font-weight: 900; 
            text-align: center; 
            line-height: 92px; 
            font-size: 14px;
            box-shadow: 0 0 20px rgba(255,0,0,0.3);
            text-shadow: 0 0 5px #000;
        }
        #boost-btn:active { background: rgba(255,0,0,0.5); transform: scale(0.95); }
    </style>
</head>
<body>

<div id="gate" class="screen">
    <img src="logo.png" class="intro-logo" onerror="this.style.display='none'">
    <h1>GARAGE RUSH</h1>
    <button class="gold-btn" id="enter-btn">ENTER ARENA</button>
</div>

<div id="briefing" class="screen" style="display:none;">
    <h1>MISSION BRIEFING</h1>
    <p id="load-status">OPTIMIZING ENGINE...</p>
    <button class="gold-btn" id="start-btn" disabled>START MISSION</button>
</div>

<div id="hud">
    <div style="font-size: 12px; letter-spacing: 1px;">TOOLS: <span id="count" style="color:#ffd700">0</span>/12</div>
    <div id="timer" style="font-size: 24px; font-weight: 900;">1:30</div>
    <div style="font-size: 9px; margin-top: 10px; color: #aaa;">SYSTEM HEAT</div>
    <div class="heat-container"><div id="heat-bar"></div></div>
</div>

<div class="joystick-container"><div class="joystick-base"></div><div class="joystick-stick" id="joystick-stick"></div></div>
<div id="boost-btn">BOOST</div>

<script type="module">
import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
import { GLTFLoader } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/loaders/GLTFLoader.js';
import { DRACOLoader } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/loaders/DRACOLoader.js';

class GarageGame {
    constructor() {
        this.active = false;
        this.items = [];
        this.collected = 0;
        this.timeLeft = 90;
        this.joystickActive = false;
        this.inputX = 0;
        this.inputY = 0;
        this.isBoosting = false;
        this.heat = 0;
        this.overheated = false;

        this.music = new Audio('https://dl.dropboxusercontent.com/scl/fi/lg4b8xgncie3x1b1ez4h8/Igzotic-Money-chaser-Official-Music-Video.mp3?rlkey=umjddw56vwumbnd2qjkg0ft2e&raw=1');
        this.music.loop = true;
        
        this.init();
    }

    init() {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x020205);
        this.camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        
        this.renderer = new THREE.WebGLRenderer({ antialias: false });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(this.renderer.domElement);

        this.scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2.5));
        
        this.player = new THREE.Group();
        const cone = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.5, 8), new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffd700, emissiveIntensity: 0.3 }));
        cone.rotation.x = Math.PI / 2; 
        this.player.add(cone);
        this.player.position.set(212, 1, -236);
        this.scene.add(this.player);

        this.setupControls();
        this.animate();
    }

    setupControls() {
        const jc = document.querySelector('.joystick-container');
        const js = document.getElementById('joystick-stick');
        const bb = document.getElementById('boost-btn');

        jc.addEventListener('touchstart', (e) => { e.preventDefault(); this.joystickActive = true; }, {passive: false});
        jc.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = jc.getBoundingClientRect();
            const dx = touch.clientX - (rect.left + rect.width/2);
            const dy = touch.clientY - (rect.top + rect.height/2);
            const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 40);
            const angle = Math.atan2(dy, dx);
            this.inputX = (Math.cos(angle) * dist) / 40;
            this.inputY = (Math.sin(angle) * dist) / 40;
            js.style.transform = `translate(calc(-50% + ${Math.cos(angle)*dist}px), calc(-50% + ${Math.sin(angle)*dist}px))`;
        }, {passive: false});
        jc.addEventListener('touchend', () => { this.joystickActive = false; this.inputX = 0; this.inputY = 0; js.style.transform = 'translate(-50%, -50%)'; });

        bb.addEventListener('touchstart', (e) => { e.preventDefault(); if(!this.overheated) this.isBoosting = true; }, {passive: false});
        bb.addEventListener('touchend', () => { this.isBoosting = false; });
    }

    animate() {
        requestAnimationFrame(() => this.animate());
        
        if(this.active) {
            // HEAT LOGIC
            const bar = document.getElementById('heat-bar');
            if(this.isBoosting && !this.overheated) {
                this.heat += 1.0; // Slightly faster heating
                if(this.heat >= 100) { this.overheated = true; this.isBoosting = false; }
            } else {
                this.heat = Math.max(0, this.heat - 0.5);
                if(this.heat <= 0) this.overheated = false;
            }
            
            bar.style.width = this.heat + "%";
            bar.style.background = this.overheated ? "#f00" : (this.heat > 75 ? "#ff0" : "#0f0");

            if(this.joystickActive) {
                let speed = (this.isBoosting) ? 1.8 : 0.85; // Boost is faster
                this.player.translateZ(this.inputY * speed);
                this.player.rotation.y -= this.inputX * 0.08;
            }
        }

        const camPos = new THREE.Vector3(0, 8, 16).applyQuaternion(this.player.quaternion);
        this.camera.position.copy(this.player.position).add(camPos);
        this.camera.lookAt(this.player.position);
        this.renderer.render(this.scene, this.camera);
    }
}

const game = new GarageGame();

document.getElementById('enter-btn').onclick = () => {
    game.music.play().catch(()=>{});
    document.getElementById('gate').style.display = 'none';
    document.getElementById('briefing').style.display = 'flex';

    const loader = new GLTFLoader();
    const draco = new DRACOLoader();
    draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
    loader.setDRACOLoader(draco);

    loader.load('https://dl.dropboxusercontent.com/scl/fi/zyvmatbq3vghfqivnoikt/arena-mobile.glb?rlkey=szzux9sj9td425xngkzu3vni1&raw=1', (gltf) => {
        game.scene.add(gltf.scene);
        document.getElementById('load-status').innerText = "STABLE CONNECTION";
        document.getElementById('start-btn').disabled = false;
    });
};

document.getElementById('start-btn').onclick = () => {
    document.getElementById('briefing').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    document.querySelector('.joystick-container').style.display = 'block';
    document.getElementById('boost-btn').style.display = 'block';
    game.active = true;
    
    setInterval(() => {
        if(!game.active) return;
        game.timeLeft--;
        document.getElementById('timer').innerText = `0:${game.timeLeft.toString().padStart(2,'0')}`;
        if(game.timeLeft <= 0) { game.active = false; alert("MISSION COMPLETE"); }
    }, 1000);
};
</script>
</body>
</html>
